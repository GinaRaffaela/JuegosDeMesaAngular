<main class="container my-5 py-5 d-flex justify-content-center">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="contact-card p-4 p-md-5">
        <h2 class="section-title mb-4">Iniciar Sesión</h2>
        
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- Campo: Usuario o Correo -->
          <div class="mb-3">
            <label for="identificador" class="form-label">Nombre de Usuario o Email *</label>
            <input type="text" id="identificador" formControlName="identificador" class="form-control" placeholder="Ej: admin o cliente&#64;gmail.com" [class.is-invalid]="f['identificador'].invalid && (f['identificador'].dirty || f['identificador'].touched)" autocomplete="username">
            <div class="error-feedback" *ngIf="f['identificador'].errors?.['required'] && (f['identificador'].dirty || f['identificador'].touched)">
              El nombre de usuario o correo electrónico es requerido.
            </div>
          </div>

          <!-- Campo: Contraseña -->
          <div class="mb-4">
            <label for="password" class="form-label">Contraseña *</label>
            <input type="password" id="password" formControlName="password" class="form-control" placeholder="Ingresa tu contraseña" [class.is-invalid]="f['password'].invalid && (f['password'].dirty || f['password'].touched)" autocomplete="current-password">
            <div class="error-feedback" *ngIf="f['password'].errors?.['required'] && (f['password'].dirty || f['password'].touched)">
              La contraseña es requerida.
            </div>
          </div>

          <!-- Botones de Acción -->
          <div class="row g-2 mb-3">
            <div class="col-12">
              <button type="submit" class="btn btn-primary w-100 py-2 fs-5" [disabled]="loginForm.invalid">Iniciar Sesión</button>
            </div>
            <div class="col-12">
              <button type="button" class="btn btn-secondary w-100 py-2 fs-5" (click)="onReset()">Limpiar Formulario</button>
            </div>
          </div>
        </form>

        <!-- Alerta de feedback general de error -->
        <div class="alert alert-danger" *ngIf="loginError" role="alert">
          Usuario o contraseña incorrectos. Por favor, verifica tus datos.
        </div>

        <!-- Enlaces Adicionales -->
        <div class="text-center mt-3 fs-6">
          <p class="mb-1 text-muted">¿No tienes cuenta? <a routerLink="/registro" class="text-emerald fw-bold">Regístrate aquí</a></p>
          <p class="mb-0"><a routerLink="/recuperar" class="text-warning">¿Olvidaste tu contraseña?</a></p>
        </div>
      </div>
    </div>
  </div>
</main>
